---
- name: Install Jenkins on AWS EC2
  hosts: aws
  become: true

  tasks:

    - name: Install Java (required by Jenkins)
      apt:
        name: openjdk-21-jre
        state: present
        update_cache: yes

    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Jenkins GPG key
      get_url:
        url: "https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key"
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add Jenkins repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Ensure Jenkins service is running
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Add jenkins user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes

    - name: Verify Jenkins service
      command: systemctl is-active jenkins
      register: jenkins_status
      changed_when: false

    - name: Display Jenkins service status
      debug:
        var: jenkins_status.stdout
