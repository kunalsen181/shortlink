---
- name: Install K3s on AWS EC2
  hosts: aws
  become: true

  tasks:

    - name: Get private IP
      shell: hostname -I | awk '{print $1}'
      register: private_ip
      changed_when: false

    - name: Install K3s
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server \
        --node-ip={{ private_ip.stdout }} \
        --advertise-address={{ private_ip.stdout }} \
        --tls-san={{ private_ip.stdout }}" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s
      service:
        name: k3s
        enabled: yes
        state: started

    - name: Wait until kubeconfig exists
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 180

    - name: Verify cluster
      command: kubectl get nodes
      register: nodes
      changed_when: false

    - debug:
        var: nodes.stdout
